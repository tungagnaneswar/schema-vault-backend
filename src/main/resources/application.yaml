spring:
  application:
    name: schema-vault-backend

  flyway:
    validate-on-migrate: false

  allow:
    cors:
      origin: ${ALLOW_CORS_ORIGIN:http://localhost:5173}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/schema_vault_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

app:
  jwt:
    secret: ${APP_JWT_SECRET:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
  encryption:
    key: ${APP_ENCRYPTION_KEY:12345678901234567890123456789012}
