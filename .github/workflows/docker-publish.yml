name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master # Triggers on push to main or master
    
    # You can also uncomment below to trigger when you create a release tag (like v1.0.0)
    # tags:
    #   - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # This tags the image as 'latest'. 
          # You can also add dynamic tags (like the commit hash or release tag).
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/schema-vault-backend:latest
